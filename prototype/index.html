<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Fitness Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../design/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-base);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.display{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.92;margin:0}
.eyebrow{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:var(--text-sm);color:var(--muted-foreground);margin:0}
.muted{color:var(--muted-foreground)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- Shell ---- */
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--space-4)) var(--space-4) calc(96px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6)}
.brand{display:flex;align-items:center;gap:var(--space-2);font-family:var(--font-display);font-weight:800;font-size:var(--text-xl);text-transform:uppercase;letter-spacing:.02em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;transform:skewX(-8deg)}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:var(--radius-full);border:1px solid var(--border);background:var(--card);display:grid;place-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{position:relative;min-height:64px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted-foreground);font-family:var(--font-display);font-weight:700;font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.06em;transition:color var(--dur-fast)}
.tab[aria-current="page"]{color:var(--primary-ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.tab .dot{position:absolute;top:12px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* ---- Building blocks ---- */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4)}
.stack>*+*{margin-top:var(--space-4)}
.section-title{font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);text-transform:uppercase;letter-spacing:.06em;margin:0 0 var(--space-3);display:flex;justify-content:space-between;align-items:baseline}
.btn{min-height:52px;border-radius:var(--radius);border:0;padding:0 var(--space-5);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);font-family:var(--font-display);font-weight:800;font-size:var(--text-lg);text-transform:uppercase;letter-spacing:.06em;transition:transform var(--dur-fast) var(--ease-out),filter var(--dur-fast)}
.btn:active{transform:scale(.97)}
a.btn{text-decoration:none}
.btn-block{width:100%}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-cardio{background:var(--accent);color:var(--accent-foreground)}
.btn-ink{background:var(--ink-950);color:var(--volt-400)}
.btn-ghost{background:var(--secondary);color:var(--secondary-foreground)}
.btn-sm{min-height:var(--tap);font-size:var(--text-base);padding:0 var(--space-4)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-full);background:var(--secondary);font-weight:600;font-size:var(--text-sm)}

/* ---- Today ---- */
.hero{margin-bottom:var(--space-6)}
.hero h1{font-size:var(--text-5xl);margin:var(--space-2) 0 var(--space-3)}
.hero h1 em{font-style:normal;color:var(--primary-ink)}
.streak{color:var(--accent-ink)}
.next{position:relative;overflow:hidden;background:var(--primary);color:var(--primary-foreground);border-radius:var(--radius-lg);padding:var(--space-5)}
.next::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(-55deg,transparent 0 22px,rgba(0,0,0,.05) 22px 44px)}
.next>*{position:relative;z-index:1}
.next .eyebrow{color:inherit;opacity:.7}
.next h2{font-size:var(--text-4xl);margin:var(--space-1) 0 var(--space-4)}
.next ul{list-style:none;margin:0 0 var(--space-5);padding:0;display:grid;gap:6px}
.next li{display:flex;justify-content:space-between;font-weight:600;border-bottom:1px solid rgba(0,0,0,.12);padding-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.stat{padding:var(--space-3) var(--space-4)}
.stat b{display:block;font-family:var(--font-display);font-weight:800;font-size:var(--text-3xl);line-height:1}
.stat b small{font-size:var(--text-base);color:var(--muted-foreground);font-weight:600;margin-left:2px}
.stat span{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-2);align-items:end;height:132px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bar{width:12px;border-radius:4px 4px 2px 2px;min-height:4px;background:var(--muted)}
.bar.s{background:var(--strength)}
.bar.c{background:var(--cardio)}
.day span{font-size:var(--text-xs);font-weight:700;color:var(--muted-foreground);text-transform:uppercase}
.day.today span{color:var(--foreground)}
.legend{display:flex;gap:var(--space-4);font-size:var(--text-sm);color:var(--muted-foreground);margin-top:var(--space-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--border)}
.list li:first-child{border-top:0;padding-top:0}
.list .grow{flex:1;min-width:0}
.list .title{font-weight:700}
.list .sub{font-size:var(--text-sm);color:var(--muted-foreground)}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.badge.s{background:color-mix(in srgb,var(--strength) 18%,transparent);color:var(--primary-ink)}
.badge.c{background:color-mix(in srgb,var(--cardio) 18%,transparent);color:var(--accent-ink)}
.big{font-family:var(--font-display);font-weight:800;font-size:var(--text-xl)}
.gain{color:var(--success);font-weight:700;font-size:var(--text-sm)}

/* ---- Train ---- */
.page-title{font-size:var(--text-4xl);margin-bottom:var(--space-5)}
.templates{display:grid;gap:var(--space-3)}
.tpl{text-align:left;width:100%;border:1px solid var(--border);background:var(--card);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;align-items:center;gap:var(--space-4);transition:border-color var(--dur-fast)}
.tpl:hover{border-color:var(--primary-ink)}
.tpl h2{font-size:var(--text-2xl)}
.tpl p{margin:4px 0 0;font-size:var(--text-sm);color:var(--muted-foreground)}
.tpl .go{margin-left:auto;color:var(--primary-ink)}
.session-head{position:sticky;top:0;z-index:10;background:var(--background);padding:var(--space-2) 0 var(--space-3);margin-bottom:var(--space-2);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3)}
.session-head h1{font-size:var(--text-4xl)}
.elapsed{font-family:var(--font-display);font-weight:800;font-size:var(--text-3xl);color:var(--primary-ink)}
.progress-line{height:4px;background:var(--muted);border-radius:4px;overflow:hidden;margin-top:var(--space-2)}
.progress-line i{display:block;height:100%;background:var(--primary);transition:width var(--dur) var(--ease-out)}
.rest{position:sticky;top:84px;z-index:9;display:flex;align-items:center;gap:var(--space-3);background:var(--foreground);color:var(--background);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.rest b{font-family:var(--font-display);font-size:var(--text-3xl);font-weight:800;line-height:1;min-width:3.2ch}
.rest .grow{flex:1}
.rest .rest-bar{height:4px;background:color-mix(in srgb,var(--background) 25%,transparent);border-radius:4px;overflow:hidden;margin-top:6px}
.rest .rest-bar i{display:block;height:100%;background:var(--primary)}
.rest button{min-width:var(--tap);min-height:var(--tap);border-radius:var(--radius);border:0;background:color-mix(in srgb,var(--background) 15%,transparent);color:inherit;font-weight:700}
.ex header{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-3)}
.ex h2{font-size:var(--text-2xl)}
.ex header span{font-size:var(--text-sm)}
.set-row{display:grid;grid-template-columns:28px 1fr 72px 64px var(--tap);gap:var(--space-2);align-items:center;padding:4px;border-radius:var(--radius);transition:background var(--dur-fast)}
.set-row.head{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);padding-top:0;padding-bottom:0}
.set-row.head span:nth-child(n+3){text-align:center}
.set-n{font-family:var(--font-display);font-weight:800;font-size:var(--text-lg);text-align:center}
.prev{font-size:var(--text-sm);color:var(--muted-foreground)}
.set-row input{width:100%;min-height:var(--tap);border-radius:var(--radius-sm);border:1px solid transparent;background:var(--muted);text-align:center;font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);padding:0}
.set-row input:focus{border-color:var(--ring);outline:none}
.check{width:var(--tap);height:var(--tap);border-radius:var(--radius-sm);border:2px solid var(--border);background:transparent;display:grid;place-items:center;color:var(--muted-foreground);transition:all var(--dur-fast)}
.set-row.done{background:color-mix(in srgb,var(--strength) 14%,transparent)}
.set-row.done .check{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.set-row.done input{background:transparent}
.pr-tag{display:inline-block;font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.06em;background:var(--accent);color:var(--accent-foreground);border-radius:4px;padding:1px 4px;margin-left:4px;vertical-align:1px}
.add-set{width:100%;margin-top:var(--space-2);min-height:var(--tap);border:1px dashed var(--border);background:none;border-radius:var(--radius);font-weight:700;color:var(--muted-foreground)}
.add-ex{display:flex;gap:var(--space-2)}
select{flex:1;min-height:52px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);padding:0 var(--space-3)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:var(--space-3)}

/* ---- Cardio ---- */
fieldset{border:0;margin:0;padding:0}
legend,.label{display:block;font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);margin-bottom:var(--space-2)}
.kinds{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds label{min-height:var(--tap);display:inline-flex;align-items:center;padding:0 var(--space-4);border-radius:var(--radius-full);background:var(--secondary);font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border:2px solid transparent}
.kinds input:checked+label{background:var(--accent);color:var(--accent-foreground)}
.kinds input:focus-visible+label{border-color:var(--foreground)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.field input{width:100%;min-height:52px;border-radius:var(--radius);border:1px solid var(--input);background:var(--muted);padding:0 var(--space-3);font-family:var(--font-display);font-weight:700;font-size:var(--text-xl)}
.field input:focus{outline:none;border-color:var(--accent)}
.field input[type=date]{font-size:var(--text-lg)}
.rpe{display:flex;align-items:center;gap:var(--space-3)}
.rpe input{flex:1;accent-color:var(--accent);height:var(--tap)}
.rpe output{font-family:var(--font-display);font-weight:800;font-size:var(--text-2xl);min-width:2ch;text-align:right}
.pace{display:flex;justify-content:space-between;align-items:center;padding:var(--space-3) var(--space-4);background:var(--muted);border-radius:var(--radius)}
.pace b{font-family:var(--font-display);font-weight:800;font-size:var(--text-2xl);color:var(--accent-ink)}

/* ---- Progress ---- */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--muted);border-radius:var(--radius);padding:4px;margin-bottom:var(--space-4)}
.seg button{min-height:40px;border:0;border-radius:var(--radius-sm);background:none;font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--foreground);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.kpi{display:flex;align-items:flex-end;gap:var(--space-3);margin:var(--space-3) 0}
.kpi b{font-family:var(--font-display);font-weight:800;font-size:var(--text-5xl);line-height:.85}
.kpi small{font-family:var(--font-display);font-size:var(--text-xl);font-weight:700;color:var(--muted-foreground)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart text{fill:var(--muted-foreground);font-size:10px;font-family:var(--font-sans);font-weight:600}
.chart .val{fill:var(--foreground);font-family:var(--font-display);font-weight:800;font-size:13px}
.cbars{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-3);align-items:end;height:150px}
.cbars .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cbars .col b{font-family:var(--font-display);font-size:var(--text-base)}
.cbars .col i{width:100%;max-width:36px;background:var(--cardio);border-radius:6px 6px 2px 2px;min-height:4px}
.cbars .col span{font-size:var(--text-xs);color:var(--muted-foreground);font-weight:600}
.cbars .col.cur i{background:var(--accent-ink)}

/* ---- Toast ---- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--foreground);color:var(--background);padding:var(--space-3) var(--space-5);border-radius:var(--radius-full);font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:all var(--dur) var(--ease-out);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.pr{background:var(--accent);color:var(--accent-foreground)}

/* ---- How-to sheet ---- */
.ex-name{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-sm)}
.ex-name:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ex-name svg{width:18px;height:18px;color:var(--muted-foreground)}
.ex-name:hover svg{color:var(--primary-ink)}
dialog.sheet{width:100%;max-width:480px;max-height:92vh;margin:auto auto 0;padding:0;border:0;border-radius:24px 24px 0 0;background:var(--card);color:var(--card-foreground);overflow:hidden;display:flex;flex-direction:column}
dialog.sheet:not([open]){display:none}
dialog.sheet::backdrop{background:rgba(5,10,15,.7);backdrop-filter:blur(3px)}
@media (min-width:560px){dialog.sheet{margin:auto;border-radius:24px}}
.sheet-media{position:relative;aspect-ratio:3/2;background:var(--muted);flex:none}
.sheet-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 300ms var(--ease-out)}
.sheet-media img.on{opacity:1}
.sheet-media .offline{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:var(--space-6);color:var(--muted-foreground);font-size:var(--text-sm)}
.sheet-close{position:absolute;top:var(--space-3);right:var(--space-3);z-index:2;background:rgba(11,11,12,.6);color:#fff;border:0}
.phase{position:absolute;left:var(--space-3);bottom:var(--space-3);z-index:2;display:flex;background:rgba(11,11,12,.6);border-radius:var(--radius-full);padding:3px;backdrop-filter:blur(6px)}
.phase button{min-height:36px;min-width:64px;border:0;border-radius:var(--radius-full);background:none;color:#fff;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:var(--text-sm)}
.phase button[aria-pressed="true"]{background:var(--volt-400);color:var(--ink-950)}
.sheet-body{overflow-y:auto;padding:var(--space-5) var(--space-5) calc(var(--space-6) + env(safe-area-inset-bottom))}
.sheet-body h2{font-size:var(--text-3xl);margin-bottom:var(--space-3)}
.tags{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-5)}
.chip.muscle{background:color-mix(in srgb,var(--strength) 16%,transparent);color:var(--primary-ink);text-transform:capitalize}
.chip.minor{text-transform:capitalize;color:var(--muted-foreground)}
.steps{margin:0 0 var(--space-5);padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 var(--space-3) 40px;line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;font-family:var(--font-display);font-weight:800}
.credit{font-size:var(--text-xs);color:var(--muted-foreground);margin-top:var(--space-3);text-align:center}
.credit a{color:inherit}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><svg class="i" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Fitness Track</div>
    <button class="icon-btn" data-act="theme" aria-label="Toggle light and dark theme"><svg class="i" viewBox="0 0 24 24" id="themeIcon"></svg></button>
  </header>
  <main id="main"></main>
</div>
<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner">
    <button class="tab" data-act="tab" data-tab="today"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Today</button>
    <button class="tab" data-act="tab" data-tab="train"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Train<span class="dot" id="liveDot" hidden></span></button>
    <button class="tab" data-act="tab" data-tab="cardio"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Cardio</button>
    <button class="tab" data-act="tab" data-tab="progress"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>Progress</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="sheet" id="howto" aria-labelledby="howtoTitle">
  <div class="sheet-media" id="howtoMedia"></div>
  <div class="sheet-body" id="howtoBody"></div>
</dialog>

<script src="exercise-info.js"></script>
<script>
/* ================= Data ================= */
const KEY = 'fitness-track.v1';
const TEMPLATES = {
  push: { name: 'Push day', ex: [['Bench Press', 80, 5, 1.25], ['Overhead Press', 47.5, 5, 0.5], ['Incline DB Press', 26, 10, 0.25], ['Triceps Pushdown', 30, 12, 0.25]] },
  pull: { name: 'Pull day', ex: [['Deadlift', 140, 5, 2.5], ['Barbell Row', 70, 8, 1], ['Lat Pulldown', 60, 10, 0.5], ['Biceps Curl', 14, 12, 0.2]] },
  legs: { name: 'Leg day', ex: [['Back Squat', 110, 5, 2], ['Romanian Deadlift', 90, 8, 1], ['Leg Press', 180, 10, 2.5], ['Calf Raise', 80, 12, 1]] },
};
const ORDER = ['push', 'pull', 'legs'];
const EXTRA = ['Pull-up', 'Front Squat', 'Hip Thrust', 'Lateral Raise', 'Face Pull', 'Dumbbell Lunge', 'Chest Fly', 'Hammer Curl'];
const LIBRARY = [...new Set([...ORDER.flatMap(k => TEMPLATES[k].ex.map(e => e[0])), ...EXTRA])].sort();
const COMPOUND = new Set(['Bench Press', 'Overhead Press', 'Deadlift', 'Barbell Row', 'Back Squat', 'Romanian Deadlift', 'Front Squat', 'Hip Thrust', 'Pull-up']);
const KINDS = ['Run', 'Bike', 'Row', 'Walk', 'Swim', 'Other'];

const pad = n => String(n).padStart(2, '0');
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => parse(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const weekStart = d => { const x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); };
const r05 = x => Math.round(x * 2) / 2;
const kgFmt = x => (Math.round(x * 10) / 10).toString();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const e1rm = (kg, reps) => (kg > 0 && reps > 0) ? (reps === 1 ? kg : kg * (1 + reps / 30)) : 0;

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296; }
function seedData() {
  const r = rng(46), workouts = [], cardio = [];
  const today = startOfDay(new Date());
  let n = 0;
  for (let ago = 42; ago >= 1; ago--) {
    const d = addDays(today, -ago), dow = d.getDay(), wk = Math.floor((42 - ago) / 7);
    if ([1, 3, 5].includes(dow)) {
      const key = ORDER[n++ % 3], t = TEMPLATES[key];
      workouts.push({ id: 'w' + ago, date: iso(d), template: key, name: t.name, durationMin: 50 + Math.round(r() * 20),
        exercises: t.ex.map(([name, base, reps, inc]) => {
          const kg = r05(base + inc * wk);
          return { name, sets: [0, 1, 2].map(i => ({ kg, reps: i === 2 && r() < 0.35 ? reps - 1 : reps })) };
        }) });
    } else if (dow === 2 || dow === 6) {
      const run = dow === 2, min = run ? 24 + Math.round(r() * 10) : 40 + Math.round(r() * 15);
      cardio.push({ id: 'c' + ago, date: iso(d), kind: run ? 'Run' : 'Bike', min,
        km: run ? +(min / 5.6 + r() * 0.4).toFixed(1) : +(min * 0.42).toFixed(1), hr: 140 + Math.round(r() * 18), rpe: 5 + Math.round(r() * 2) });
    }
  }
  return { workouts, cardio, active: null, rotation: n };
}

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
if (!state || !Array.isArray(state.workouts)) state = seedData();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
let ui = { tab: (location.hash.slice(1) || 'today'), progMode: 'strength', progEx: 'Bench Press', rest: null, focusKey: null };

/* ================= Derived ================= */
function topSet(sets) { let best = 0, top = null; sets.forEach(s => { const v = e1rm(+s.kg, +s.reps); if (v > best) { best = v; top = s; } }); return { best, top }; }
function exHistory(name) { return state.workouts.flatMap(w => { const ex = w.exercises.find(e => e.name === name); if (!ex) return []; const t = topSet(ex.sets); return t.best ? [{ date: w.date, ...t }] : []; }); }
const bestE1rm = name => Math.max(0, ...exHistory(name).map(h => h.best));
function lastSets(name) { for (let i = state.workouts.length - 1; i >= 0; i--) { const ex = state.workouts[i].exercises.find(e => e.name === name); if (ex) return ex.sets; } return null; }
const volume = w => w.exercises.reduce((a, ex) => a + ex.sets.reduce((b, s) => b + (+s.kg) * (+s.reps), 0), 0);
function recentPRs(limit = 3) {
  const best = {}, prs = [];
  state.workouts.forEach(w => w.exercises.forEach(ex => {
    const t = topSet(ex.sets), prev = best[ex.name];
    if (prev && t.best > prev + 0.01) prs.push({ date: w.date, name: ex.name, kg: t.top.kg, reps: t.top.reps, e: t.best, gain: t.best - prev });
    if (t.best > (prev || 0)) best[ex.name] = t.best;
  }));
  return prs.slice(-limit).reverse();
}
function weekStreak() {
  let s = 0, ws = addDays(weekStart(new Date()), -7);
  for (;;) { const a = iso(ws), b = iso(addDays(ws, 7)); if (state.workouts.filter(w => w.date >= a && w.date < b).length >= 3) { s++; ws = addDays(ws, -7); } else return s; }
}
const nextTemplate = () => ORDER[(state.rotation || 0) % 3];

function viewToday() {
  const now = new Date(), ws = weekStart(now), wsI = iso(ws), endI = iso(addDays(ws, 7));
  const wkW = state.workouts.filter(w => w.date >= wsI && w.date < endI);

function lineChart(pts) {
  const W = 320, H = 170, L = 6, R = 6, T = 22, B = 22;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 2) { hi += 1; lo -= 1; } const pd = (hi - lo) * 0.18; lo -= pd; hi += pd;
  const x = i => L + (pts.length === 1 ? 0.5 : i / (pts.length - 1)) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.y).toFixed(1)}`).join(' ');
  const last = pts.length - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one rep max from ${Math.round(pts[0].y)} to ${Math.round(pts[last].y)} kilograms" style="color:var(--chart-1)">
    ${[0, .5, 1].map(f => `<line class="grid" x1="0" x2="${W}" y1="${T + f * (H - T - B)}" y2="${T + f * (H - T - B)}"/>`).join('')}
    <path d="${d} L${x(last)} ${H - B} L${x(0)} ${H - B} Z" fill="currentColor" fill-opacity=".14"/>
    <path d="${d}" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="${i === last ? 5 : 2.5}" fill="${i === last ? 'currentColor' : 'var(--card)'}" stroke="currentColor" stroke-width="2"><title>${fmtDate(p.date)}: ${Math.round(p.y)} kg</title></circle>`).join('')}
    <text class="val" x="${Math.min(x(last), W - 4)}" y="${y(pts[last].y) - 10}" text-anchor="end">${Math.round(pts[last].y)}</text>
    <text x="0" y="${H - 4}">${fmtDate(pts[0].date)}</text><text x="${W}" y="${H - 4}" text-anchor="end">${fmtDate(pts[last].date)}</text>
  </svg>`;
}

  const max = Math.max(1, ...weeks.map(w => w.min)), tot = weeks.reduce((a, w) => ({ min: a.min + w.min, km: a.km + w.km, n: a.n + w.n }), { min: 0, km: 0, n: 0 });

  </div>
  <section class="card"><h2 class="section-title">Minutes per week <span class="eyebrow">6 wks</span></h2>
    <div class="cbars">${weeks.map((w, i) => `<div class="col ${i === 5 ? 'cur' : ''}"><b class="num">${w.min}</b><i style="height:${w.min ? Math.max(4, w.min / max * 100) : 2}%"></i><span>${i === 5 ? 'This wk' : fmtDate(iso(w.s))}</span></div>`).join('')}</div>
  </section>`;
}

/* ================= Render ================= */
const main = document.getElementById('main');
function render() {
  const views = { today: viewToday, train: viewTrain, cardio: viewCardio, progress: viewProgress };
  if (!views[ui.tab]) ui.tab = 'today';
  main.innerHTML = views[ui.tab]();
  document.querySelectorAll('.tab').forEach(t => t.dataset.tab === ui.tab ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
  document.getElementById('liveDot').hidden = !state.active;
  if (ui.focusKey) { const el = main.querySelector(`[data-key="${ui.focusKey}"]`); if (el) el.focus({ preventScroll: true }); ui.focusKey = null; }
  tick();
}
function go(tab) { ui.tab = tab; history_replace(tab); render(); window.scrollTo({ top: 0 }); }
function history_replace(tab) { try { history.replaceState(null, '', '#' + tab); } catch (e) {} }

let toastT;
function toast(msg, pr) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.toggle('pr', !!pr); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* Timers */
function tick() {
  const el = document.getElementById('elapsed');
  if (el && state.active) { const s = Math.floor((Date.now() - state.active.start) / 1000), h = Math.floor(s / 3600); el.textContent = (h ? h + ':' : '') + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
  const box = document.getElementById('rest');
  if (ui.rest) {
    const left = Math.ceil((ui.rest.end - Date.now()) / 1000);
    if (left <= 0) { ui.rest = null; toast('Rest over. Next set!'); try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {} }
    else if (box) { box.hidden = false; document.getElementById('restTime').textContent = Math.floor(left / 60) + ':' + pad(left % 60); document.getElementById('restBar').style.width = (left / ui.rest.total * 100) + '%'; }
  }
  if (box && !ui.rest) box.hidden = true;
}
setInterval(tick, 250);

/* ================= Actions ================= */
function startSession(key) {
  const t = TEMPLATES[key];
  state.active = { template: key || null, name: t ? t.name : 'Session', start: Date.now(), exercises: t ? t.ex.map(e => newExercise(e[0])) : [] };
  save(); go('train');
}
function newExercise(name) {
  const prev = lastSets(name);
  return { name, sets: (prev || [{ kg: '', reps: '' }, { kg: '', reps: '' }, { kg: '', reps: '' }]).map(s => ({ kg: s.kg, reps: s.reps, done: false, pr: false })) };
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, a = state.active;
  if (act === 'tab') go(b.dataset.tab);
  else if (act === 'theme') { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); setTheme(cur === 'light' ? 'dark' : 'light'); }
  else if (act === 'start') { if (a && !confirm('A workout is already in progress. Discard it and start a new one?')) return go('train'); startSession(b.dataset.tpl); }
  else if (act === 'check') {
    const i = +b.dataset.i, j = +b.dataset.j, ex = a.exercises[i], s = ex.sets[j];
    if (!s.done) {
      const kg = parseFloat(s.kg), reps = parseInt(s.reps, 10);
      if (!(kg >= 0) || !(reps > 0)) { toast('Enter weight and reps first'); return; }
      s.done = true;
      const v = e1rm(kg, reps), best = Math.max(bestE1rm(ex.name), ...ex.sets.filter((x, k) => k !== j && x.done).map(x => e1rm(+x.kg, +x.reps)));
      s.pr = best > 0 && v > best + 0.01;
      if (s.pr) toast(`New PR! ${ex.name} ${kgFmt(kg)} × ${reps}`, true);
      const total = COMPOUND.has(ex.name) ? 150 : 90; ui.rest = { end: Date.now() + total * 1000, total };
    } else { s.done = false; s.pr = false; }
    ui.focusKey = b.dataset.key; save(); render();
  }
  else if (act === 'addset') { const ex = a.exercises[+b.dataset.i], l = ex.sets[ex.sets.length - 1] || { kg: '', reps: '' }; ex.sets.push({ kg: l.kg, reps: l.reps, done: false, pr: false }); ui.focusKey = b.dataset.key; save(); render(); }
  else if (act === 'addex') { a.exercises.push(newExercise(document.getElementById('exSel').value)); save(); render(); }
  else if (act === 'rest' && ui.rest) { ui.rest.end += (+b.dataset.d) * 1000; ui.rest.total = Math.max(ui.rest.total, (ui.rest.end - Date.now()) / 1000); tick(); }
  else if (act === 'rest-skip') { ui.rest = null; tick(); }
  else if (act === 'discard') { if (confirm('Discard this workout? Logged sets will be lost.')) { state.active = null; ui.rest = null; save(); go('today'); } }
  else if (act === 'finish') {
    const exercises = a.exercises.map(ex => ({ name: ex.name, sets: ex.sets.filter(s => s.done).map(s => ({ kg: parseFloat(s.kg), reps: parseInt(s.reps, 10) })) })).filter(ex => ex.sets.length);
    if (!exercises.length) { toast('Tick at least one set to finish'); return; }
    const w = { id: 'w' + Date.now(), date: iso(new Date()), template: a.template, name: a.name, durationMin: Math.round((Date.now() - a.start) / 60000), exercises };
    const prs = a.exercises.reduce((n, ex) => n + ex.sets.filter(s => s.pr).length, 0);
    state.workouts.push(w); if (a.template) state.rotation = (state.rotation || 0) + 1;
    state.active = null; ui.rest = null; save(); go('today');
    toast(`Workout saved · ${(volume(w) / 1000).toFixed(1)} t lifted${prs ? ` · ${prs} PR${prs > 1 ? 's' : ''}` : ''}`, prs > 0);
  }
  else if (act === 'prog') { ui.progMode = b.dataset.m; render(); }
  else if (act === 'howto') openHowto(b.dataset.name, b);
  else if (act === 'phase') { stopFlip(); showPhase(+b.dataset.p); }
  else if (act === 'howto-close') document.getElementById('howto').close();
});

/* ================= How-to sheet ================= */
let flipT = null, howtoReturn = null;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function showPhase(p) {
  document.querySelectorAll('#howtoMedia img').forEach((im, i) => im.classList.toggle('on', i === p));
  document.querySelectorAll('#howtoMedia .phase button').forEach((bt, i) => bt.setAttribute('aria-pressed', i === p));
}
function stopFlip() { clearInterval(flipT); flipT = null; }
function openHowto(name, from) {
  const info = EXERCISE_INFO[name]; if (!info) return;
  const dlg = document.getElementById('howto'); howtoReturn = from;
  document.getElementById('howtoMedia').innerHTML = `
    ${info.images.map((src, i) => `<img src="${EXERCISE_IMG_BASE + encodeURI(src)}" alt="${esc(name)}, ${i ? 'end' : 'start'} position" ${i ? 'loading="lazy"' : ''} class="${i ? '' : 'on'}">`).join('')}
    <div class="offline" hidden>Photos need an internet connection.</div>
    <button class="icon-btn sheet-close" data-act="howto-close" aria-label="Close">${icon('x')}</button>
    <div class="phase" role="group" aria-label="Movement phase"><button data-act="phase" data-p="0" aria-pressed="true">Start</button><button data-act="phase" data-p="1" aria-pressed="false">End</button></div>`;
  document.querySelectorAll('#howtoMedia img').forEach(im => im.addEventListener('error', () => { document.querySelector('#howtoMedia .offline').hidden = false; document.querySelector('#howtoMedia .phase').hidden = true; stopFlip(); }));
  const video = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name + ' exercise proper form');
  document.getElementById('howtoBody').innerHTML = `
    <p class="eyebrow">${esc(info.equipment || '')} · ${esc(info.level || '')}</p>
    <h2 class="display" id="howtoTitle">${esc(name)}</h2>
    <div class="tags">${info.primary.map(m => `<span class="chip muscle">${esc(m)}</span>`).join('')}${info.secondary.map(m => `<span class="chip minor">${esc(m)}</span>`).join('')}</div>
    <ol class="steps">${info.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    <a class="btn btn-ghost btn-block" href="${video}" target="_blank" rel="noopener">${icon('play')}Watch a video</a>
    <p class="credit">Photos &amp; steps: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">free-exercise-db</a> (public domain)</p>`;
  dlg.showModal();
  dlg.querySelector('.sheet-body').scrollTop = 0;
  stopFlip(); let p = 0;
  if (!reduceMotion.matches) flipT = setInterval(() => showPhase(p = 1 - p), 1100);
}
document.getElementById('howto').addEventListener('close', () => { stopFlip(); if (howtoReturn && document.contains(howtoReturn)) howtoReturn.focus(); });
document.getElementById('howto').addEventListener('click', e => { if (e.target.id === 'howto') e.target.close(); });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && state.active) { const s = state.active.exercises[+t.dataset.i].sets[+t.dataset.j]; s[t.dataset.f] = t.value.replace(',', '.'); save(); }
  if (t.closest('#cardioForm')) updatePace();
});
document.addEventListener('change', e => { if (e.target.id === 'progEx') { ui.progEx = e.target.value; render(); } if (e.target.closest('#cardioForm')) updatePace(); });

function updatePace() {
  const f = document.getElementById('cardioForm'); if (!f) return;
  const d = new FormData(f), min = parseFloat(d.get('min')), km = parseFloat(String(d.get('km')).replace(',', '.')), kind = d.get('kind');
  document.getElementById('rpeOut').textContent = d.get('rpe');
  const byPace = ['Run', 'Walk'].includes(kind);
  document.getElementById('paceLabel').textContent = byPace ? 'Pace' : 'Speed';
  let out = '—';
  if (min > 0 && km > 0) { if (byPace) { const p = min / km; out = `${Math.floor(p)}:${pad(Math.round((p % 1) * 60) % 60)} /km`; } else out = `${(km / (min / 60)).toFixed(1)} km/h`; }
  document.getElementById('pace').textContent = out;
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'cardioForm') return; e.preventDefault();
  const d = new FormData(e.target), min = parseInt(d.get('min'), 10);
  if (!(min > 0)) { toast('Add a duration'); e.target.elements.min.focus(); return; }
  const km = parseFloat(String(d.get('km')).replace(',', '.')), hr = parseInt(d.get('hr'), 10);
  state.cardio.push({ id: 'c' + Date.now(), date: d.get('date') || iso(new Date()), kind: d.get('kind'), min, km: km > 0 ? km : null, hr: hr > 0 ? hr : null, rpe: +d.get('rpe') });
  save(); toast(`${d.get('kind')} saved · ${min} min`, false); render();
});

/* Theme */
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem(KEY + '.theme', t); } catch (e) {} paintThemeIcon(); }
function paintThemeIcon() { const light = (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')) === 'light'; document.getElementById('themeIcon').innerHTML = light ? IC.moon : IC.sun; }
try { const t = localStorage.getItem(KEY + '.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
paintThemeIcon();
render();
</script>
</body>
</html>
